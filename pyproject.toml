[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supportops-ai"
version = "0.1.0"
description = "Enterprise-grade multi-agent customer support platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "SupportOps AI Team" },
]

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # --- Agent orchestration ---
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "crewai>=0.70.0",

    # --- Data / settings ---
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # --- Database ---
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # --- Cache / broker ---
    "redis>=5.0.0",

    # --- Auth ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 (unmaintained since 2020) probes bcrypt.__about__, which
    # bcrypt>=4.1 removed; that break also trips a stricter 72-byte check in
    # passlib's own self-test. Pin below the break until passlib is replaced
    # or patches this.
    "bcrypt<4.1",
    "python-multipart>=0.0.9",

    # --- HTTP client ---
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.hatch.build.targets.wheel]
packages = ["backend"]
