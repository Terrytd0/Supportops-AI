name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Type Check & Test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # Check out the repository so subsequent steps have the source tree.
      - uses: actions/checkout@v4

      # Provision the Python version the project targets, with pip's
      # dependency cache keyed off pyproject.toml for faster, repeatable runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Upgrade pip to ensure a consistent, up-to-date installer.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Install the project along with development dependencies
      # (ruff, mypy, pytest) declared in the `dev` extra.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Static lint pass: style, import order, and common bug patterns
      # (see [tool.ruff] / [tool.ruff.lint] in pyproject.toml for config).
      - name: Lint with ruff
        run: ruff check .

      # Static type check across the whole repo (see [tool.mypy] in pyproject.toml).
      - name: Type check with mypy
        run: mypy .

      # Unit/integration test suite (see [tool.pytest.ini_options] in pyproject.toml).
      - name: Run tests
        run: pytest

  docker:
    name: Docker Build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Only build the image once lint/type-check/tests have passed, so a
    # broken build is never masked by -- and never masks -- a code issue.
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Build the production image from the project's Dockerfile to catch
      # packaging/build regressions (e.g. missing files, broken installs)
      # on every push and PR. The image is not pushed anywhere.
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t supportops-ai:ci .
